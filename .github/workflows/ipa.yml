name: Build iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Compile for iPhone and package IPA
        run: |
          set -euo pipefail
          xcodebuild -project IPAWorkshop.xcodeproj -scheme IPAWorkshop -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/IPAWorkshopBuild" CODE_SIGNING_ALLOWED=NO build
          app="$RUNNER_TEMP/IPAWorkshopBuild/Build/Products/Release-iphoneos/IPAWorkshop.app"
          test -x "$app/IPAWorkshop"
          mkdir -p dist/Payload
          ditto "$app" dist/Payload/IPAWorkshop.app
          (cd dist && /usr/bin/zip -qry IPAWorkshop-unsigned.ipa Payload)
          /usr/bin/unzip -tq dist/IPAWorkshop-unsigned.ipa
          /usr/bin/unzip -p dist/IPAWorkshop-unsigned.ipa Payload/IPAWorkshop.app/Info.plist > "$RUNNER_TEMP/IPAWorkshop.plist"
          /usr/bin/plutil -lint "$RUNNER_TEMP/IPAWorkshop.plist"
          /usr/bin/lipo "$app/IPAWorkshop" -verify_arch arm64
          (cd dist && shasum -a 256 IPAWorkshop-unsigned.ipa > SHA256SUMS.txt)
      - name: Keep workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPAWorkshop
          path: |
            dist/IPAWorkshop-unsigned.ipa
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish direct IPA download
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tag="build-${GITHUB_SHA:0:12}"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/IPAWorkshop-unsigned.ipa dist/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" dist/IPAWorkshop-unsigned.ipa dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "IPA 工坊 · $tag" --notes '此為未簽名的 iPhone IPA。使用自己的 Apple 開發簽名後即可安裝。'
          fi
